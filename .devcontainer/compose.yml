services:
  dev-service:
    build:
      context: .
      dockerfile: dockerfile
    volumes:
      - ..:/workspaces/project
    command: sleep infinity
    env_file: .env.dev
    depends_on:
      - stalwart

  stalwart:
    image: stalwartlabs/stalwart:v1.0.0
    env_file: .env.dev
    ports: 
      - "8080:8080"
    volumes:
      - ./stalwart/:/etc/stalwart/
      - stalwart-data:/var/lib/stalwart

volumes:
  stalwart-data: