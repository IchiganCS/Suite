name: suite-compose
services:
  dev-service:
    build:
      context: .
      dockerfile: dockerfile
    volumes:
      - ..:/workspaces/project
    command: sleep infinity
    env_file: .env.dev
    depends_on:
      - stalwart

  stalwart:
    image: stalwartlabs/stalwart:v1.0.0
    env_file: .env.dev
    ports: 
      - "8080:8080"
    volumes:
      # intentionally mount the relative stalwart directory so it reads config.json
      - ${LOCAL_WORKSPACE_FOLDER}/.devcontainer/stalwart/:/etc/stalwart/
      - stalwart-data:/var/lib/stalwart
    environment:
      # these values are only passed if explicitly set - we use these sometimes
      - STALWART_RECOVERY_MODE
      - STALWART_RECOVERY_ADMIN

volumes:
  stalwart-data: