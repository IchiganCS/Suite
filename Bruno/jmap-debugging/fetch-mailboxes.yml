info:
  name: fetch-mailboxes
  type: http
  seq: 1

http:
  method: POST
  url: "{{stalwart-jmap-url}}"
  body:
    type: json
    data: |-
      {
        "using": [
          "urn:ietf:params:jmap:core",
          "urn:ietf:params:jmap:mail"
        ],
        "methodCalls": [
          [
            "Mailbox/get",
            {
              "accountId": "{{accountId}}",
              "ids": null
            },
            "c1"
          ]
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
