opencollection: 1.0.0

info:
  name: jmap-debugging
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: basic
    username: "{{process.env.STALWART_USER}}"
    password: "{{process.env.STALWART_PASSWORD}}"
  variables:
    - name: freeAccountId
      value: b
  scripts:
    - type: tests
      code: |-
        test("No JMAP methodResponse is an error", function () {
          const body = res.getBody();
          const methodResponses = body.methodResponses;
          
          if (methodResponses === undefined)
            return;

          expect(methodResponses).to.be.an("array").that.is.not.empty;

          methodResponses.forEach((response, index) => {
            const methodName = response[0];
            expect(
              methodName,
              `methodResponses[${index}] should not be "error" (got: ${JSON.stringify(response[1])})`
            ).to.not.equal("error");
          });
        });
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
